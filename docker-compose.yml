services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conabio_user
      POSTGRES_PASSWORD: conabio_pass
      POSTGRES_DB: conabio_mvp
    volumes:
      - conabio_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conabio_user -d conabio_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
   # profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
   # profiles: [ollama] 
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    #entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2:3b && echo 'Modelo listo'"]
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:0.5b && echo 'Modelo listo'"]
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://conabio_user:conabio_pass@db:5432/conabio_mvp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - conabio_pdfs:/app/generated_pdfs
      - ./galeria:/app/galeria
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5173/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  conabio_db_data:
  conabio_pdfs:
  ollama_data:
